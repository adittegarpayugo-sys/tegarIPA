.stat{text-align:center}.stat b{font-size:30px;display:block;color:var(--ac)}

.b:hover,.b2:hover{filter:brightness(1.1)}

.opt:hover{border-color:var(--ac)}.opt.r{background:#1a9b5b;color:#fff}.opt.w{background:#d64545;color:#fff}

function draw(){if(!S.name){login();return}
$("#top").innerHTML=`<header><h1>🔤 English IPA Learning Lab</h1><small>👤 ${S.name} · No. ${S.no}</small><button class="b2" onclick="logout()">Log out</button></header><nav>${NAV.map(n=>`<button class="${page===n[0]||(page==="detail"&&n[0]==="learn")?"on":""}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join("")}</nav>`;
const a=$("#app");a.style.animation="none";a.offsetWidth;a.style.animation="";a.innerHTML=({home,learn,detail,chart,practice,pairs,cards,quiz,escape,port})[page]();if(page==="cards")fc()}
function home(){const best=S.quiz.length?Math.max(...S.quiz.map(q=>q.p)):0;return `<div class="card"><h2>Welcome, ${S.name}! 👋</h2><p>Learn, listen, record and practise all 44 English sounds. <span class="mut">Belajar, dengarkan, rekam, dan latih 44 bunyi bahasa Inggris.</span></p><div class="bar"><i style="width:${pct()}%"></i></div><p class="mut">Progress: ${pct()}%</p></div>
<div class="card"><h3>🎤 Microphone</h3><button class="b" onclick="enMic()">🎤 Enable Microphone</button><p id="ms" class="mut">${MS&&MS.active?"✅ Microphone ready. / Mikrofon siap.":"Allow once now, so recording works instantly in every lesson. / Izinkan sekali sekarang agar rekaman langsung jalan di semua materi."}</p></div>
<div class="grid"><div class="card stat"><b>${pct()}%</b>Progress</div><div class="card stat"><b>${learned()}/44</b>Sounds learned</div><div class="card stat"><b>${S.ex}</b>Exercises done</div><div class="card stat"><b>${best}%</b>Best quiz</div></div>
<div class="grid">${NAV.slice(1).map(n=>`<button class="tile" onclick="go('${n[0]}')"><div style="font-size:32px">${n[1]}</div>${n[2]}</button>`).join("")}</div>`}
function learn(){const r=[[0,12],[12,20],[20,44]][cat];return `<div class="card"><h2>📚 44 English IPA Sounds</h2><div class="row">${CATS.map((c,i)=>`<button class="b2 ${cat===i?"on":""}" onclick="cat=${i};draw()">${c}</button>`).join("")}</div></div><div class="grid s">${ALL.slice(r[0],r[1]).map((it,k)=>`<button class="tile sy ${S.learned[it.s]?"ok":""}" onclick="go('detail',${r[0]+k})">/${it.s}/${S.learned[it.s]?"<br><small>✓</small>":""}</button>`).join("")}</div>`}
function pp(i){const it=ALL[i];return `<div class="card"><h3>🎙️ Pronunciation Practice</h3><button class="b" id="rb" onclick="rec()">🎙️ Record Yourself</button><button class="b2" onclick="sp(${i},0,0)">🔊 Model</button><p id="rs" class="mut">${S.learned[it.s]?"✅ Completed / Selesai. ":(SRok()?"Not completed yet: pass the pronunciation check below. / Belum selesai: lulus cek pengucapan di bawah. ":"Not completed yet: choose a self-assessment. / Belum selesai: pilih penilaian. ")}</p><label class="b2" style="display:inline-block;cursor:pointer">📱 Upload / record with device<input type="file" accept="audio/*" capture="user" hidden onchange="upl(this)"></label><audio id="pb" controls style="display:none;width:100%"></audio><hr><h4>🎯 Pronunciation Check / Cek Pengucapan</h4><p class="mut">Choose a word, press the button and say it clearly. The app will tell you if it is correct or wrong. / Pilih kata, tekan tombol, ucapkan dengan jelas. Aplikasi akan menilai benar atau salah.</p><select id="cw">${it.w.map(w=>`<option>${w.w}</option>`).join("")}</select><button class="b" id="cb" onclick="chk(${i})">🎯 Say it &amp; Check</button><div id="cr"></div><p class="mut">${S.chk[it.s]?"Your checks: "+S.chk[it.s].c+"/"+S.chk[it.s].t+" correct / benar":""}</p><p>Self-assessment / Penilaian mandiri:</p><div class="row rt">${["😟 Need Practice","🙂 Getting There","😎 Confident"].map((l,k)=>`<button class="b2 ${S.rate[it.s]===k?"on":""}" onclick="rate(${i},${k})">${l}</button>`).join("")}</div></div>`}
function detail(){const it=ALL[cur];return `<div class="row"><button class="b2" onclick="go('learn')">← Back</button><button class="b2" onclick="go('detail',${(cur+43)%44})">◀ Prev</button><button class="b2" onclick="go('detail',${(cur+1)%44})">Next ▶</button></div>
<div class="card"><div class="sym">/${it.s}/</div><span class="tag">${CN[it.c]}</span> <span class="tag">${it.tag}</span><p><b>How to say it:</b> ${it.en}</p><p class="mut">🇮🇩 ${it.id}</p>
<div class="wrap"><table><tr><th>Word</th><th>IPA (BrE)</th><th>Meaning</th><th>Position</th><th>Listen</th></tr>${it.w.map((w,j)=>`<tr><td><b>${w.w}</b></td><td>/${w.p}/</td><td>${w.m}</td><td>${pos(w,it.s)}</td><td><button class="b" onclick="sp(${cur},${j},0)">🔊 Normal</button><button class="b2" onclick="sp(${cur},${j},1)">🐢 Slow</button></td></tr>`).join("")}</table></div></div>${pp(cur)}`}
let mr,ch=[],MS=null;
const HELP="Click the 🔒 icon in the address bar → set Microphone to Allow → reload. / Klik ikon 🔒 di address bar → ubah Mikrofon menjadi Izinkan → muat ulang halaman. If the page is shown inside an app or preview, the browser may block the mic: open the page link in a new browser tab, or use the “Upload / record with device” button. / Jika halaman tampil di dalam aplikasi atau pratinjau, mikrofon bisa diblokir: buka link di tab baru browser, atau pakai tombol “Upload / record with device”.";
async function getMic(){if(MS&&MS.active)return MS;MS=await navigator.mediaDevices.getUserMedia({audio:true});return MS}
async function enMic(){const s=$("#ms");try{await getMic();s.innerHTML="✅ Microphone ready. Record Yourself now works instantly. / Mikrofon siap; tombol Record langsung bisa dipakai."}catch(e){s.innerHTML="⚠️ Microphone blocked or unavailable.<br>"+HELP}}
async function rec(){const rs=$("#rs"),rb=$("#rb");if(mr&&mr.state==="recording"){mr.stop();return}
try{const st=await getMic();mr=new MediaRecorder(st);ch=[];mr.ondataavailable=e=>ch.push(e.data);
mr.onstop=()=>{const a=$("#pb");a.src=URL.createObjectURL(new Blob(ch,{type:mr.mimeType}));a.style.display="block";S.recs++;save();rb.textContent="🎙️ Record Yourself";rs.textContent="Saved ✓ Press play and compare. / Putar dan bandingkan."};
mr.start();rb.textContent="⏹ Stop";rs.textContent="Recording… / Merekam…"}catch(e){rs.innerHTML="⚠️ Microphone unavailable or blocked.<br>"+HELP}}
function rate(i,k){const s=ALL[i].s;if(S.rate[s]===undefined)S.ex++;S.rate[s]=k;if(!SRok())S.learned[s]=1;save();document.querySelectorAll(".rt button").forEach((b,j)=>b.classList.toggle("on",j===k))}
function practice(){const cnt=[0,0,0];Object.values(S.rate).forEach(k=>cnt[k]++);return `<div class="card"><h2>🎙️ Pronunciation Practice</h2><select onchange="cur=+this.value;draw()">${ALL.map((it,i)=>`<option value="${i}" ${i===cur?"selected":""}>/${it.s}/ — ${it.w[0].w}</option>`).join("")}</select><div class="row"><button class="b2" onclick="go('detail',cur)">Open lesson</button></div><p class="mut">Words: ${ALL[cur].w.map(w=>w.w).join(", ")}</p></div>${pp(cur)}<div class="grid"><div class="card stat"><b>${S.recs}</b>Recordings</div><div class="card stat"><b>${cnt[0]}</b>😟 Need Practice</div><div class="card stat"><b>${cnt[1]}</b>🙂 Getting There</div><div class="card stat"><b>${cnt[2]}</b>😎 Confident</div></div>`}
function chart(){const pt=it=>{const l=30+180*it.t;return[l+it.fx*(370-l),30+240*it.t]};
return `<div class="card"><h2>🗺️ Interactive Vowel Chart</h2><p class="mut">Click a symbol to hear it. / Klik simbol untuk mendengar.</p><svg viewBox="0 0 440 310" style="width:100%;max-width:640px"><polygon points="30,30 370,30 370,270 210,270" style="fill:none;stroke:var(--ac);stroke-width:2"/><line class="ln" x1="120" y1="150" x2="370" y2="150"/><line class="ln" x1="200" y1="30" x2="290" y2="270"/>
<text class="vl" x="30" y="18">Front</text><text class="vl" x="190" y="18">Central</text><text class="vl" x="340" y="18">Back</text><text class="vl" x="385" y="34">Close</text><text class="vl" x="385" y="154">Mid</text><text class="vl" x="385" y="274">Open</text>
${ALL.slice(0,12).map((it,i)=>{const[x,y]=pt(it);return `<g onclick="vc(${i})"><circle class="vc" cx="${x}" cy="${y}" r="21"/><text class="vt" x="${x}" y="${y+5}" text-anchor="middle">${it.s}</text></g>`}).join("")}</svg><div id="vi" class="mut"></div></div>`}
function vc(i){const it=ALL[i];sp(i,0,0);$("#vi").innerHTML=`<b>/${it.s}/</b> — ${HE[it.h]} · ${BE[it.b]}. ${it.en}<br>🇮🇩 ${it.id}<br>Example: <b>${it.w[0].w}</b> /${it.w[0].p}/`}
const PR="sheep,ship;full,fool;bed,bad;cat,cut;seat,sit;pen,pan;look,Luke;cot,caught;thin,sin;berry,very;light,right;pull,pool".split(";").map(x=>x.split(","));
let G=null;
function pairs(){if(!G)G={n:0,c:0,q:null,done:0};if(G.done)return `<div class="card"><h2>🎧 Result</h2><h1>${G.c}/10</h1><button class="b" onclick="G=null;draw()">Play again</button></div>`;
if(!G.q){const p=sh(PR)[0];G.q={p,t:Math.random()<.5?0:1,a:0,o:sh([0,1])}}const q=G.q;
return `<div class="card"><h2>🎧 Minimal Pairs Game</h2><p class="mut">Round ${G.n+1}/10 · Score ${G.c}. Listen, then choose the word you heard. / Dengarkan, pilih kata yang benar.</p><button class="b" onclick="say('${q.p[q.t]}',0)">🔊 Listen</button><button class="b2" onclick="say('${q.p[q.t]}',1)">🐢 Slow</button>${q.o.map(k=>`<button class="opt" id="o${k}" onclick="mpA(${k})">${q.p[k]}</button>`).join("")}<p id="fb"></p></div>`}
function mpA(k){const q=G.q;if(q.a)return;q.a=1;const ok=k===q.t;if(ok)G.c++;S.mp.t++;if(ok)S.mp.c++;$("#o"+k).classList.add(ok?"r":"w");$("#o"+q.t).classList.add("r");$("#fb").innerHTML=ok?"✅ Correct! / Benar!":`❌ It was “${q.p[q.t]}”. / Jawaban: ${q.p[q.t]}.`+`<br><button class="b" onclick="mpN()">Next ▶</button>`;if(ok)$("#fb").innerHTML+=`<br><button class="b" onclick="mpN()">Next ▶</button>`;save()}
function mpN(){G.n++;G.q=null;if(G.n>=10){G.done=1;S.ex++;save()}draw()}
let F={o:[...Array(44).keys()],i:0,f:0};
function cards(){return `<div class="card"><h2>🃏 IPA Flashcards <small class="mut">${F.i+1}/44</small></h2><div class="flash" onclick="F.f=!F.f;fc()" id="fl"></div><div class="row" style="justify-content:center"><button class="b2" onclick="F.i=(F.i+43)%44;F.f=0;fc()">◀ Previous</button><button class="b" onclick="F.f=!F.f;fc()">Flip</button><button class="b2" onclick="F.i=(F.i+1)%44;F.f=0;fc()">Next ▶</button><button class="b2" onclick="F.o=sh(F.o);F.i=0;F.f=0;fc()">🔀 Shuffle</button><button class="b" onclick="sp(F.o[F.i],0,0)">🔊 Listen</button></div></div><script>0<\/script>`}
function fc(){const i=F.o[F.i],it=ALL[i],w=it.w[0];$("#fl").innerHTML=F.f?`<h2>${w.w} /${w.p}/</h2><p>${w.m} · ${pos(w,it.s)}</p><p style="font-size:14px">${it.en}</p><p class="mut" style="font-size:13px">🇮🇩 ${it.id}</p>`:`<div class="sym" style="font-size:90px">/${it.s}/</div><span class="tag">${CN[it.c]}</span>`;document.querySelector(".card h2 small").textContent=(F.i+1)+"/44"}
let Q=null;
function mkQ(){const it=sh(ALL)[0],w=sh(it.w)[0],u=a=>[...new Map(a.map(x=>[x.w||x.s,x])).values()];
if(Math.random()<.5){const ds=u(sh(ALLW.filter(x=>!x.p.includes(it.s)))).slice(0,3);return{q:`Which word contains the sound /${it.s}/? <span class="mut">Kata mana yang memuat bunyi /${it.s}/?</span>`,o:sh([w,...ds]).map(x=>x.w),a:w.w,e:`${w.w} /${w.p}/ (${w.m}) contains /${it.s}/.`}}
const ds=sh(ALL.filter(x=>!w.p.includes(x.s))).slice(0,3);return{q:`Which sound is in “${w.w}” /${w.p}/? <span class="mut">Bunyi apa dalam kata ini?</span>`,o:sh([it,...ds]).map(x=>"/"+x.s+"/"),a:"/"+it.s+"/",e:`${w.w} /${w.p}/ (${w.m}) has the sound /${it.s}/.`}}
function quiz(){if(!Q)return `<div class="card"><h2>📝 Pronunciation Quiz</h2><p>15 random questions on monophthongs, diphthongs and consonants. <span class="mut">15 soal acak.</span></p><button class="b" onclick="Q={l:Array.from({length:15},mkQ),i:0,s:0,m:[],a:0};draw()">Start Quiz ▶</button></div>`;
if(Q.i>=15){const p=Math.round(Q.s/15*100);return `<div class="card"><h2>🏁 Final Score</h2><h1>${Q.s}/15 (${p}%)</h1>${Q.m.length?`<h3>Review / Pembahasan</h3>${Q.m.map(m=>`<p>❌ ${m.q}<br>Your answer: ${m.y} · Correct: <b>${m.a}</b><br><span class="mut">${m.e}</span></p>`).join("")}`:"<p>Perfect! 🎉</p>"}<button class="b" onclick="Q=null;draw()">Try again</button></div>`}
const q=Q.l[Q.i];return `<div class="card"><p class="mut">Question ${Q.i+1}/15 · Score ${Q.s}</p><h3>${q.q}</h3>${q.o.map((o,k)=>`<button class="opt" onclick="qa(${k})">${o}</button>`).join("")}<div id="qf"></div></div>`}
function qa(k){const q=Q.l[Q.i];if(Q.a)return;Q.a=1;const b=document.querySelectorAll(".opt");b.forEach((x,j)=>{if(q.o[j]===q.a)x.classList.add("r")});const ok=q.o[k]===q.a;if(ok)Q.s++;else{b[k].classList.add("w");Q.m.push({q:q.q,y:q.o[k],a:q.a,e:q.e})}
$("#qf").innerHTML=`<p>${ok?"✅ Correct!":"❌ Not quite."} ${q.e}</p><button class="b" onclick="qn()">${Q.i===14?"See score":"Next ▶"}</button>`}
function qn(){Q.i++;Q.a=0;if(Q.i>=15){S.quiz.push({p:Math.round(Q.s/15*100),d:new Date().toLocaleDateString()});S.ex++;save()}draw()}
const EP=[["Which symbol is the voiced partner of /s/? (same place, throat vibrates)",["/z/","/ʃ/","/θ/","/t/"],"/z/","I"],["Which word contains /θ/?",["think","this","ship","job"],"think","P"],["How many monophthongs are in British English?",["8","12","20","24"],"12","A"],["Which symbol is the schwa?",["/ə/","/ɜː/","/ʌ/","/æ/"],"/ə/","-"],["Choose the IPA for “ship”",["/ʃɪp/","/sɪp/","/ʃiːp/","/tʃɪp/"],"/ʃɪp/","4"],["Which diphthong is in “home”?",["/əʊ/","/aʊ/","/ɔɪ/","/eə/"],"/əʊ/","4"]];
function escape(){const n=S.esc,clues=EP.slice(0,n).map(e=>e[3]).join(" ");let h=`<div class="card"><h2>🔬 Phonetics Escape Room</h2><p>You are locked in the Phonetics Laboratory! Solve all 6 puzzles to get the exit code. <span class="mut">Selesaikan 6 teka-teki untuk kode keluar.</span></p><p style="font-size:24px">🗝️ Clues: <b>${clues||"…"}</b></p></div>`;
if(n>=6)return h+`<div class="card"><h2>🔓 Door open!</h2><h1>Code: IPA-44</h1><button class="b2" onclick="S.esc=0;save();draw()">Play again</button></div>`;
const e=EP[n];return h+`<div class="card"><p class="mut">Puzzle ${n+1}/6</p><h3>${e[0]}</h3>${sh(e[1]).map(o=>`<button class="opt" onclick="ea('${o}')">${o}</button>`).join("")}<p id="ef"></p></div>`}
function ea(o){const e=EP[S.esc];if(o===e[2]){S.esc++;if(S.esc===6)S.ex++;save();draw()}else $("#ef").textContent="❌ Try again. / Coba lagi."}
function port(){const L=["😟 Need Practice","🙂 Getting There","😎 Confident"],cnt=c=>ALL.filter(i=>i.c===c&&S.learned[i.s]).length;return `<div class="card"><h2>🎓 Learning Portfolio</h2><h3>${S.name} · No. ${S.no}</h3><button class="b noprint" onclick="print()">🖨️ Print / Save as PDF</button></div>
<div class="card"><h3>Completed materials</h3><p>Monophthongs ${cnt(0)}/12 · Diphthongs ${cnt(1)}/8 · Consonants ${cnt(2)}/24 · <b>Total ${learned()}/44 (${pct()}%)</b></p><div class="bar"><i style="width:${pct()}%"></i></div></div>
<div class="card"><h3>Quiz results</h3>${S.quiz.length?S.quiz.slice(-8).map(q=>`<p>${q.d}: <b>${q.p}%</b></p>`).join(""):"<p class='mut'>No quiz yet.</p>"}</div>
<div class="card"><h3>Practice</h3><p>Recordings: ${S.recs} · Pronunciation checks correct: ${Object.values(S.chk).reduce((a,x)=>a+x.c,0)}/${Object.values(S.chk).reduce((a,x)=>a+x.t,0)} · Exercises completed: ${S.ex} · Minimal pairs: ${S.mp.c}/${S.mp.t} correct · Escape room: ${S.esc>=6?"solved ✓":S.esc+"/6"}</p></div>
<div class="card"><h3>Confidence</h3>${Object.keys(S.rate).length?[2,1,0].map(k=>{const l=Object.keys(S.rate).filter(s=>S.rate[s]===k);return l.length?`<p>${L[k]}: ${l.map(s=>"/"+s+"/").join(" ")}</p>`:""}).join(""):"<p class='mut'>No self-assessment yet.</p>"}</div>`}
if(window.speechSynthesis)speechSynthesis.getVoices();
draw();
</script></body></html>
